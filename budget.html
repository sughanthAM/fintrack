<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - FinTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">FinTrack</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="transactions.html">Transactions</a>
            <a href="budget.html" class="active">Budget</a>
            <a href="reports.html">Reports</a>
            <div class="user-dropdown">
                <button class="dropdown-toggle" id="userDropdownBtn">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userNameDisplay">User</span>
                </button>
                <div class="dropdown-menu" id="userDropdownMenu">
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
        <div class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="transactions.html">Transactions</a>
                <a href="budget.html" class="active">Budget</a>
                <a href="reports.html">Reports</a>
            </nav>
        </aside>

        <main class="main-content" id="main-content">
            <div class="page-header">
                <div>
                    <h1>Budget Planner</h1>
                    <p class="welcome-msg">Set and monitor your monthly spending limits.</p>
                </div>
                <button class="btn btn-primary" onclick="document.getElementById('addBudgetModal').classList.add('active')">Set Budget</button>
            </div>

            <div class="month-year-selector">
                <div class="form-group">
                    <label>Month</label>
                    <select id="budgetMonth">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <select id="budgetYear">
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </div>

            <div class="budget-summary" id="budgetSummary">
                <div class="stat-card">
                    <div class="stat-label">Total Budget</div>
                    <div class="stat-value" id="summaryTotalBudget">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Spent</div>
                    <div class="stat-value" id="summaryTotalSpent">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Remaining</div>
                    <div class="stat-value" id="summaryTotalRemaining">₹0</div>
                </div>
            </div>

            <div class="budget-cards-grid" id="budgetCardsContainer">
                <div class="budget-card fade-in-up">
                    <div style="padding: 40px; text-align: center; color: var(--text-secondary);">
                        <div class="spinner" style="margin: 0 auto 10px;"></div>
                        Loading budgets...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Budget Modal -->
    <div class="modal-overlay" id="addBudgetModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Set Budget</h3>
                <button class="close-btn" onclick="document.getElementById('addBudgetModal').classList.remove('active')">&times;</button>
            </div>
            <form id="budgetForm">
                <div class="form-group">
                    <label>Category</label>
                    <select id="budgetCategory" required>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Travel">Travel</option>
                        <option value="Rent">Rent</option>
                        <option value="Other Expense">Other Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount Limit</label>
                    <input type="number" id="budgetAmount" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Budget</button>
            </form>
        </div>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle">&equiv;</button>
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/budget.js"></script>
</body>
</html>
