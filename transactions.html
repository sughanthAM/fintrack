<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - FinTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">FinTrack</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="transactions.html" class="active">Transactions</a>
            <a href="budget.html">Budget</a>
            <a href="reports.html">Reports</a>
            <div class="user-dropdown">
                <button class="dropdown-toggle" id="userDropdownBtn">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userNameDisplay">User</span>
                </button>
                <div class="dropdown-menu" id="userDropdownMenu">
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
        <div class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="transactions.html" class="active">Transactions</a>
                <a href="budget.html">Budget</a>
                <a href="reports.html">Reports</a>
            </nav>
        </aside>

        <main class="main-content" id="main-content">
            <div class="page-header">
                <div>
                    <h1>Transactions</h1>
                    <p class="welcome-msg">Manage and track all your financial activities.</p>
                </div>
                <button class="btn btn-primary" onclick="document.getElementById('addTransactionModal').classList.add('active')">Add Transaction</button>
            </div>

            <div class="filter-bar">
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="filterFrom">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="filterTo">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="filterType">
                        <option value="">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Search</label>
                    <input type="text" id="filterSearch" placeholder="Search description...">
                </div>
                <button class="btn btn-outline" id="filterBtn">Filter</button>
            </div>

            <div class="card fade-in-up">
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr>
                                <td colspan="6" class="text-center" style="padding: 30px;">
                                    <div class="spinner" style="margin: 0 auto;"></div>
                                    <p class="mt-1" style="color: var(--text-secondary);">Loading transactions...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="paginationControls"></div>
            </div>
        </main>
    </div>

    <!-- Add Transaction Modal -->
    <div class="modal-overlay" id="addTransactionModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Transaction</h3>
                <button class="close-btn" onclick="document.getElementById('addTransactionModal').classList.remove('active')">&times;</button>
            </div>
            <form id="transactionForm">
                <input type="hidden" id="transactionId">
                <div class="radio-group">
                    <label><input type="radio" name="type" value="income" required> Income</label>
                    <label><input type="radio" name="type" value="expense" required checked> Expense</label>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Salary">Salary</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Transaction</button>
            </form>
        </div>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle">&equiv;</button>
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
